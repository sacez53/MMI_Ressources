<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MMI Ressources</title>
        <script src="js/app.js"></script>
        <link rel="stylesheet" href="style/style.css" />
    </head>
    <body>
        <header>
            <div class="header-left">
                <button
                    id="sidebar-toggle"
                    class="sidebar-toggle"
                    aria-label="Ouvrir les filtres"
                    aria-expanded="false"
                    aria-controls="category-drawer"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="32"
                        height="32"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="3"
                        stroke-linecap="butt"
                        stroke-linejoin="miter"
                    >
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <h1>MMI Ressources</h1>
            </div>
            <div class="header-right">
                <a
                    href="about.html"
                    class="settings-btn"
                    aria-label="À propos"
                    style="margin-right: 15px"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        height="32px"
                        viewBox="0 -960 960 960"
                        width="32px"
                        fill="currentColor"
                    >
                        <path
                            d="M440-280h80v-240h-80v240Zm68.5-331.5Q520-623 520-640t-11.5-28.5Q497-680 480-680t-28.5 11.5Q440-657 440-640t11.5 28.5Q463-600 480-600t28.5-11.5ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"
                        />
                    </svg>
                </a>
                <button
                    id="settings-btn"
                    class="settings-btn"
                    aria-label="Paramètres"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        height="32px"
                        viewBox="0 -960 960 960"
                        width="32px"
                        fill="currentColor"
                    >
                        <path
                            d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"
                        />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Volet latéral escamotable des catégories (Drawer) -->
        <div id="category-drawer-overlay" class="drawer-overlay" aria-hidden="true"></div>
        <aside id="category-drawer" class="category-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
            <div class="drawer-header">
                <div class="drawer-header-title">
                    <span class="drawer-decor-square"></span>
                    <h2 id="drawer-title">Catégories</h2>
                </div>
                <button id="close-drawer-btn" class="drawer-close-btn" aria-label="Fermer le panneau des catégories">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
                        <path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/>
                    </svg>
                </button>
            </div>

            <div class="drawer-search-wrapper">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px" fill="currentColor">
                    <path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/>
                </svg>
                <input type="text" id="category-search" class="drawer-search-input" placeholder="Filtrer les catégories..." autocomplete="off" />
            </div>

            <nav class="drawer-category-list" id="category-bar" aria-label="Liste des catégories"></nav>

            <div class="drawer-footer">
                <button id="drawer-reset-btn" class="btn-drawer-reset">Afficher tout</button>
            </div>
        </aside>

        <div class="content-wrapper">
            <!-- Barre de contrôle des filtres Bauhaus -->
            <div class="filter-toolbar">
                <div class="filter-toolbar-left">
                    <button id="open-drawer-btn" class="btn-open-drawer" aria-expanded="false" aria-controls="category-drawer">
                        <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor">
                            <path d="M440-160q-17 0-28.5-11.5T400-200v-240L168-736q-15-20-4.5-42t36.5-22h560q26 0 36.5 22t-4.5 42L560-440v240q0 17-11.5 28.5T520-160h-80Zm40-308 198-252H282l198 252Zm0 0Z"/>
                        </svg>
                        <span>Filtrer par catégorie</span>
                    </button>
                    <div id="active-filter-badge" class="active-filter-badge">
                        <span class="active-filter-label">Catégorie : <strong id="current-filter-name">Toutes les ressources</strong></span>
                        <button id="reset-filter-btn" class="btn-reset-filter" title="Afficher toutes les ressources" aria-label="Afficher toutes les ressources" style="display: none;">
                            &times;
                        </button>
                    </div>
                </div>
                <div class="filter-toolbar-right">
                    <span id="resource-count" class="resource-count">0 ressource</span>
                </div>
            </div>

            <main id="resource-grid"></main>
        </div>

        <footer>
            <p>&copy; 2026 Bibliothèque de Liens.</p>
        </footer>

        <!-- Fenêtre modale des paramètres -->
        <div id="settings-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn" id="close-settings">&times;</span>
                <h2>Paramètres</h2>

                <div class="setting-item">
                    <label for="toggle-descriptions"
                        >Masquer les descriptions</label
                    >
                    <label class="switch">
                        <input type="checkbox" id="toggle-descriptions" />
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
        <!-- Modale de Confirmation -->
        <div id="confirm-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn" id="close-confirm">&times;</span>
                <h2>Ouvrir le lien ?</h2>
                <p style="margin-bottom: 20px; font-weight: 500">
                    Êtes-vous sûr de vouloir visiter ce site ?
                </p>
                <p
                    id="confirm-site-name"
                    style="
                        font-weight: 800;
                        font-size: 1.2em;
                        color: var(--b-blue);
                        margin-bottom: 30px;
                        word-wrap: break-word;
                    "
                ></p>

                <div style="display: flex; gap: 15px">
                    <button id="btn-cancel-link" class="btn-cancel">
                        Annuler
                    </button>
                    <button id="btn-confirm-link" class="btn-confirm">
                        Ouvrir le site
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
