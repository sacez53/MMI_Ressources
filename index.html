<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MMI Ressources</title>
        <script src="js/app.js"></script>
        <link rel="stylesheet" href="style/style.css">
    </head>
    <body>
        <header>
            <div class="header-left">
                <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="butt" stroke-linejoin="miter">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <h1>MMI Ressources</h1>
            </div>
            <div class="header-right">
                <p>Généré dynamiquement via JSON</p>
                <button id="settings-btn" class="settings-btn" aria-label="Paramètres">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="butt" stroke-linejoin="miter">
                        <line x1="4" y1="21" x2="4" y2="14"></line>
                        <line x1="4" y1="10" x2="4" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12" y2="3"></line>
                        <line x1="20" y1="21" x2="20" y2="16"></line>
                        <line x1="20" y1="12" x2="20" y2="3"></line>
                        <line x1="1" y1="14" x2="7" y2="14"></line>
                        <line x1="9" y1="8" x2="15" y2="8"></line>
                        <line x1="17" y1="16" x2="23" y2="16"></line>
                    </svg>
                </button>
            </div>
        </header>

        <div class="content-wrapper">
            <nav class="category-bar" id="category-bar"></nav>
            <main id="resource-grid"></main>
        </div>

        <footer>
            <p>&copy; 2026 Bibliothèque de Liens.</p>
        </footer>

        <!-- Fenêtre modale des paramètres -->
        <div id="settings-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn" id="close-settings">&times;</span>
                <h2>Paramètres</h2>
                
                <div class="setting-item">
                    <label for="toggle-dark-mode">Mode sombre</label>
                    <label class="switch">
                        <input type="checkbox" id="toggle-dark-mode">
                        <span class="slider"></span>
                    </label>
                </div>
                
                <div class="setting-item">
                    <label for="toggle-descriptions">Masquer les descriptions</label>
                    <label class="switch">
                        <input type="checkbox" id="toggle-descriptions">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </body>
</html>
